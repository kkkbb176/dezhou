<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>德州助手 · 牌桌快速录入与决策</title>
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="/fast-ui.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span aria-hidden="true">♠</span> 德州助手 <small>快速录入</small></div>
    <nav aria-label="主要功能"><button class="nav-current" id="tableTab">牌桌</button><button id="playersBtn">玩家档案</button><button id="gotoGtoBtn">GTO 范围</button></nav>
    <span id="modeButtons" class="position-buttons"></span><span id="tableSizeButtons" class="position-buttons"></span>
    <details id="tableSettings"><summary>牌桌设置</summary><div class="settings-popover">
      <div class="label">Hero 座位</div><div id="heroPositionButtons" class="position-buttons"></div>
      <label class="group">环境 <select id="environmentSelect"></select></label>
      <div class="group"><button id="newTableBtn">新牌桌</button><button id="resetHandBtn">重置本手</button></div><button id="clearVillainsBtn">清空其他玩家</button>
    </div></details>
  </header>
  <main id="main">
    <section id="left" aria-label="牌桌与录入">
      <div class="table-toolbar"><strong id="streetLine">等待开局</strong><span id="handSize" class="hint">—</span><button id="fillSeatsBtn">一键加入玩家</button><button id="nextHandBtn" class="primary">下一手 →</button></div>
      <div id="notices" aria-live="polite"></div>
      <div id="tableWrap">
        <div class="table-outline" aria-hidden="true"></div>
        <div id="tableCenter"><div id="potLine">底池 —</div><div id="boardRow" aria-label="公共牌"></div><div id="handPanel"><span class="hint">我的手牌</span><div id="heroHandRow"></div><div id="handHint" class="hint"></div></div></div>
        <div id="seats"></div>
        <section id="cardPicker" hidden aria-label="选牌面板"><div class="picker-heading"><strong id="pickerTarget">选择手牌</strong><button id="clearCardBtn">清除当前牌</button><button id="closePickerBtn" aria-label="关闭选牌">关闭 ×</button></div><div id="pickerGrid"></div><span class="hint">选牌后自动定位下一槽；公共牌更正按已有状态规则处理。</span></section>
      </div>
      <details id="timelinePanel"><summary>行动时间线 <span id="recentActions">尚未录入</span></summary><div id="timeline"></div></details>
      <section id="inputDock" aria-label="快速录入">
        <div class="actor-heading"><span class="section-label">当前行动</span><strong id="actorLine">—</strong><span class="follow-badge">自动跟随</span><button id="undoBtn" title="撤销上一次牌局操作；编辑文字时 Ctrl+Z 撤销文字">↶ 撤销 <kbd>Ctrl+Z</kbd></button></div>
        <div id="saveStatus" role="status"></div>
        <div class="amount-row"><label id="amountLabel" for="amountInput">加注到</label><input id="amountInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="输入金额" aria-describedby="amountHelp amountError" /><div id="amountUnits" aria-label="金额单位"><button id="unitChips" type="button">筹码</button><button id="unitBB" type="button">BB</button></div></div>
        <div id="amountHelp" class="hint">金额表示本街累计投入目标</div><div id="amountError" role="alert"></div>
        <div class="quick-row"><span class="hint">快捷金额</span><div id="sizeButtons"></div></div><div id="actionButtons"></div>
        <div class="dock-footer"><span>金额输入时，快捷键不触发行动</span><span id="statGrid"></span></div>
      </section>
    </section>
    <aside id="rail" aria-label="当前建议">
      <div class="recommendation-heading"><h1>当前建议</h1><span id="autoAnalyzeBadge" class="badge">自动分析：开启</span></div>
      <div id="autoAnalyzeLine" class="autoLine" role="status">等待输入</div><div id="result" aria-live="polite">轮到 Hero 时会自动分析。</div>
      <div class="analysis-controls"><button id="autoToggleBtn" aria-pressed="true">自动分析：开启</button><button id="analyzeBtn" disabled>↻ 重新分析</button></div><div id="blockers" class="blocked"></div>
      <details class="rail-details"><summary>范围与依据、使用限制</summary><div id="limits" class="hint"></div></details>
      <details class="rail-details" id="debugPanel"><summary>输入与计算明细（调试）</summary>
        <details class="debug"><summary>行动者与座位绑定</summary><pre id="debugSeats">—</pre></details><details class="debug"><summary>底池、筹码、街道</summary><pre id="debugMath">—</pre></details><details class="debug"><summary>实际规范化输入</summary><pre id="debugInput">—</pre></details><details class="debug"><summary>状态指纹</summary><pre id="debugFingerprint">—</pre></details><details class="debug"><summary>引擎候选、影子结果与版本</summary><pre id="debugDecision">—</pre></details>
      </details><span id="saveHint" class="hint"></span>
    </aside>
  </main>
  <div id="overlay"><div id="modal" role="dialog" aria-modal="true"></div></div><div id="seatTip" class="seatTip"></div><div id="toast" role="status"></div>
  <script src="/fast-input.js"></script><script src="/table.js"></script>
</body>
</html>
