<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>德州扑克 · 牌桌快速录入（内部 Alpha）</title>
    <link rel="stylesheet" href="/table.css" />
    <!--
      LIVE UI V3：布局与外观。

      加载顺序是刻意的：`table.css` 先（基础组件：按钮、牌面、弹层、时间线），
      `live-ui.css` 后（唯一负责布局与视觉规范）。

      V3 不再往旧文件末尾追加覆盖规则 —— 见 `live-ui.css` 顶部的说明。
    -->
    <link rel="stylesheet" href="/live-ui.css" />
  </head>
  <body>
    <!--
      交互式牌桌录入（Internal Alpha）

      🔴 本页面**不含任何策略判断，也不含任何牌局状态机**。

      它只做两件事：
        1. 把用户的点击翻译成一个「操作意图」，POST 给 /api/table
        2. 把服务端返回的 state + preview **渲染**出来

      「轮到谁」「谁能做什么」「底池多少」「街道推进到哪」全部来自后端。
      这样「前端认为轮到 UTG、后端认为是 CO」这类分歧在结构上不可能发生。

      ── LIVE UI V3 布局 ──────────────────────────────────────────────
      顶部工具栏（42px）/ 左侧主战况区（座位 Pill 网格 + 中心牌面）/ 右侧操作台（372px）。

      V3 与 V2 的结构差异：
        · **没有拟物椭圆牌桌**，`#tableWrap` 是一个 5×3 的座位网格，
          中间 3 列 × 中间行留给中心牌面；
        · 座位是紧凑 Pill（92×46），只显示「名字 / 位置 / 筹码 / 当前动作」；
        · 右栏四段固定顺序，建议区**不因内容变化而上下跳动**。
    -->

    <!-- ═══ 顶部工具栏：单行 42px。只放「一局中会改」的东西 ═══ -->
    <div id="topbar">
      <div class="tb-group">
        <span class="tb-label">桌型</span>
        <span id="tableSizeButtons" class="position-buttons"></span>
      </div>
      <div class="tb-group">
        <span class="tb-label">Hero</span>
        <span id="heroPositionButtons" class="position-buttons"></span>
      </div>
      <div class="tb-group">
        <span class="tb-label">盲注</span>
        <select id="environmentSelect"></select>
      </div>

      <div class="tb-group tb-actions">
        <button id="nextHandBtn" class="primary">下一手</button>
        <button id="undoBtn">撤销</button>
      </div>

      <span class="spacer"></span>
      <span id="saveHint" class="hint"></span>

      <!--
        设置菜单：低频操作收进来（新牌桌 / 重置本手 / 玩家管理 / GTO / 说明 / 调试）。
        这些按钮的 **id 与文字都没变**，只是外面多了一层可折叠容器，
        因此 table.js 里所有 `$('...')` 与测试里的 `node('...')` / 按文字查找都不受影响。
      -->
      <div class="more">
        <button id="moreBtn" class="more-btn" title="设置与玩家管理">设置</button>
        <div id="moreMenu" class="more-menu">
          <div class="mm-title">牌桌</div>
          <button id="resetHandBtn">重置本手</button>
          <button id="newTableBtn" class="danger">新牌桌</button>
          <div class="mm-title">玩家</div>
          <button id="fillSeatsBtn">一键加入玩家</button>
          <button id="clearVillainsBtn">清空其他玩家</button>
          <div class="mm-title">模式</div>
          <!--
            AUTO ANALYZE 的唯一模式开关。

            - **当前决策**：正常打牌。轮到 Hero 且信息齐备 → 自动分析，不用点按钮。
            - **录入历史**：补录过去已经发生的动作。**永不自动分析**，
              已显示的建议会先被收起来（否则一条过期的建议会误导正在补录的人）。

            默认「当前决策」，且 `新牌桌 / 下一手` 都会重置回它。
          -->
          <span id="modeButtons" class="position-buttons"></span>
          <span id="autoAnalyzeBadge" class="badge">自动分析：开启</span>
          <div class="mm-title">其他</div>
          <button id="gotoGtoBtn">GTO 范围</button>
          <details class="mm-details">
            <summary>系统说明</summary>
            <div class="hint" id="limits"></div>
          </details>
          <details class="mm-details">
            <summary>调试数据</summary>
            <div class="mm-debug">
              <details class="debug">
                <summary>当前行动者 / 逻辑位置 / 视觉位置 / playerId 绑定</summary>
                <pre id="debugSeats">—</pre>
              </details>
              <details class="debug">
                <summary>底池 / 筹码 / 街道</summary>
                <pre id="debugMath">—</pre>
              </details>
              <details class="debug">
                <summary>实际提交的 ManualHandInput（送进 Alpha Pipeline 的就是它）</summary>
                <pre id="debugInput">—</pre>
              </details>
              <details class="debug">
                <summary>后端重放出的状态指纹</summary>
                <pre id="debugFingerprint">—</pre>
              </details>
              <details class="debug">
                <summary>引擎候选 / 动态 Shadow / 版本</summary>
                <pre id="debugDecision">—</pre>
              </details>
            </div>
          </details>
        </div>
      </div>
    </div>

    <!-- ═══ 主体：左（主战况）1fr / 右（操作台）372px ═══ -->
    <div id="main">
      <div id="left">
        <div id="notices"></div>
        <!--
          🔴 **桌型（座位容量）** 与 **本手人数** 是两个数字（Table Topology Correction）。

          9 座桌坐 8 人是现金局最常见的形态。这一行由后端算好的拓扑填充 ——
          前端不做任何推导，因此不可能出现「前端以为 9 人、后端按 8 人发牌」。
        -->
        <div id="handSize" class="banner info">—</div>

        <!--
          主战况区：5 列 × 3 行的座位网格。
          座位由 `renderSeats()` 按 `visualIndex` 放进单元格（见那里的说明）。
          中间 3 列 × 中间行是**中心牌面区**，与座位不重叠、互不遮挡。
        -->
        <div id="tableWrap">
          <div id="tableCenter">
            <div id="streetLine">—</div>
            <div id="potLine">底池 —</div>
            <div id="boardRow"></div>
            <div id="heroHandInline">
              <!-- 标签写全：「Hero 手牌」而不是只写「Hero」—— 前者一眼说明这一块是什么 -->
              <span class="hh-label">Hero 手牌</span>
              <div id="heroHandRow"></div>
            </div>
          </div>
          <div id="seats"></div>
        </div>

        <!--
          牌面选择器：**静态折叠结构**，默认收起（只在选牌时才需要），
          不占主战况区的版面。

          🔴 折叠容器直接写在 HTML 里，不由 JS 用 `insertBefore` 现场包裹 ——
             V1 那版 JS 包裹在假 DOM（没有 insertBefore）里抛错，
             而且一旦抛错就整条 `boot()` 挂掉。
        -->
        <details class="panel-flat" id="handPanel">
          <summary class="panel-summary">牌面选择器<span id="handHint" class="mm-count"></span></summary>
          <div id="cardPicker">
            <div id="pickerTarget" class="hint"></div>
            <div id="pickerGrid"></div>
          </div>
        </details>
      </div>

      <!-- ═══ 右侧操作台：宽度固定 372px，四段固定顺序 ═══ -->
      <div id="rail">
        <!-- ① 当前行动（单行 + 一行数据，不堆卡片） -->
        <div id="actorBlock" class="rblock">
          <div id="actorLine">—</div>
          <!--
            自动分析状态条。**必须始终可见**（规范：「禁止用户猜测到底有没有开始分析」）。
            文案由后端算好的 `preview.decision.state` 决定，前端不做判断。
          -->
          <div id="autoAnalyzeLine" class="autoLine">—</div>
        </div>

        <!-- ② 快速录入：合法动作 + 快捷尺寸 + 自定义金额 -->
        <div class="rblock">
          <div class="rblock-cap">快速录入</div>
          <div id="actionButtons"></div>
          <div id="quickSizes"></div>
          <div id="sizeButtons"></div>
          <!--
            自定义金额入口。仅在**后端给出尺寸网格**（即下注 / 加注是合法动作）时显示。

            🔴 合法性**完全由后端裁决**：
            - `min` / `max` / `placeholder` 全部来自后端已算好的
              `minRaiseToBB` / `allInToBB` / 尺寸网格，前端不推导任何边界；
            - 前端不判断「这个数够不够最小加注」，直接把 `amountChips` 发出去，
              非法就由引擎返回 `ILLEGAL_ACTION`，`sendOp` 会把它弹成红条提示。
          -->
          <div id="customAmount" hidden>
            <span class="ca-label">自定义</span>
            <input id="customAmountInput" type="number" inputmode="decimal" />
            <button id="customAmountSend">确定</button>
          </div>
          <div id="statGrid" class="statGrid"></div>
          <div id="blockers" class="blocked"></div>
        </div>

        <!-- ③ Hero 决策：只显示最重要的结果，详细内容默认隐藏 -->
        <div class="rblock rblock-grow">
          <div class="rblock-cap">
            Hero 决策
            <span class="cap-note">建议与实际录入严格分开</span>
          </div>
          <div id="result" class="hint">轮到 Hero 时会自动分析。</div>
          <div class="actionMeta">
            <button id="analyzeBtn" class="primary" disabled>重新分析</button>
          </div>
        </div>

        <!-- ④ 最近行动（最近 5 条；完整历史走二级入口） -->
        <div class="rblock" id="recentBlock">
          <div class="rblock-cap">最近行动</div>
          <div id="recentActions"></div>
          <details class="liveFold" id="timelinePanel">
            <summary id="timelineSummary">完整时间线</summary>
            <div class="liveFold-body" id="timeline"></div>
          </details>
        </div>
      </div>
    </div>

    <div id="overlay">
      <div id="modal"></div>
    </div>
    <!-- PLAYER PROFILE TABLE UI V1：悬停画像提示（不拦截点击，避免遮挡公共牌/底池/按钮） -->
    <div id="seatTip" class="seatTip"></div>
    <div id="toast"></div>

    <script src="/table.js"></script>
  </body>
</html>
